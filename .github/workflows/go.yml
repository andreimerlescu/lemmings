name: Go Lemmings
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Build lemmings and the demo target
        run: go build ./...
      - name: Dashboard JavaScript parses
        run: node --check web/app.js && node --check web/theme.js
  test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.25.x' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Unit, integration and end-to-end tests with race detector
        run: go test -race -count=1 -v ./...
  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Benchmarks
        run: go test -bench=. -benchmem -run='^$' -count=1 ./...
  fuzz:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - FuzzDetectWaitingRoom
          - FuzzSha512sum
          - FuzzExtractSitemapLocs
          - FuzzExtractHTMLLinks
          - FuzzResolveURL
          - FuzzHandleAuth
          - FuzzDashboardHTML
          - FuzzFormatInt
          - FuzzFormatBytes
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Fuzz ${{ matrix.target }}
        # -fuzz accepts exactly one package; the demo target is a second one.
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s .
